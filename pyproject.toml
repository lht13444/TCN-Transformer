[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcn-transformer"
version = "0.1.0"
description = "Temporal feature components for lane-change trajectory research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]
